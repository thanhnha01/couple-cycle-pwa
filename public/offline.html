<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8c3f5d" />
    <title>Couple Cycle — Offline</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #fff9fb; color: #321d25; }
      main { width: min(32rem, calc(100% - 3rem)); text-align: center; }
      .mark { display: grid; place-items: center; width: 4rem; height: 4rem; margin: 0 auto 1.5rem; border-radius: 1.25rem; background: #8c3f5d; color: white; font-size: 2rem; }
      h1 { font-size: 1.75rem; margin: 0 0 .75rem; }
      p { color: #725764; line-height: 1.6; margin: 0 0 1.5rem; }
      button { border: 0; border-radius: 999px; background: #8c3f5d; color: white; padding: .8rem 1.2rem; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">↻</div>
      <h1>You’re offline</h1>
      <p>Previously opened pages remain available. Reconnect to load anything new.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
